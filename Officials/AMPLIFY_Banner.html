<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMPLIFY Campaign Banner</title>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #d7e3fc; }
    .banner { width: 100%; height: 300px; background: linear-gradient(to right, #d7e3fc 50%, #004aad 50%); position: relative; display: flex; align-items: center; justify-content: space-between; padding: 20px; box-sizing: border-box; }
    .left-side { flex: 1; text-align: center; color: #1b3b5a; }
    .monument { font-size: 48px; margin-bottom: 10px; } /* Placeholder for monument sketch */
    .young-people { font-size: 24px; margin-bottom: 10px; } /* Placeholder for smiling young people */
    .flag { font-size: 36px; margin-bottom: 10px; } /* Placeholder for Cameroonian flag */
    .motifs { font-size: 18px; } /* Placeholder for traditional motifs */
    .right-side { flex: 1; text-align: center; color: white; }
    .logo { max-width: 150px; position: absolute; bottom: 10px; right: 10px; }
    .title { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
    .subtitle { font-size: 18px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="left-side">
      <div class="monument">🏛️ Reunification Monument</div>
      <div class="young-people">😊 Young People Smiling</div>
      <div class="flag">🇨🇲 Cameroonian Flag</div>
      <div class="motifs">Traditional Motifs 🌿</div>
    </div>
    <div class="right-side">
      <div class="title">AMPLIFY Campaign</div>
      <div class="subtitle">Join the Movement</div>
    </div>
    <img src="Logo/4.png" alt="Amplify logo" class="logo" />
  </div>
</body>
</html>
